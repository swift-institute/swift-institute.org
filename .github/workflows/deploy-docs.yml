name: Deploy redirect

# swift-institute.org is closed: every path on the domain sends visitors to the
# Swift Institute GitHub organization. GitHub Pages keeps serving the domain so
# its HTTPS certificate stays valid; index.html answers the root and 404.html
# answers every other path. JS in <head> redirects before paint; <meta refresh>
# is the no-JS fallback, and the body link is for readers that follow neither.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DOMAIN: "swift-institute.org"
  TARGET_URL: "https://github.com/swift-institute"

jobs:
  build:
    name: Build redirect
    runs-on: ubuntu-latest
    # Gate workflow_dispatch: only main can trigger a deploy, even manually.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p site
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <script>window.location.replace('${TARGET_URL}');</script>
            <meta http-equiv="refresh" content="0; url=${TARGET_URL}">
            <link rel="canonical" href="${TARGET_URL}">
            <meta name="robots" content="noindex">
            <title>Swift Institute</title>
          </head>
          <body>
            <p>Swift Institute lives on GitHub: <a href="${TARGET_URL}">${TARGET_URL}</a>.</p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html
          echo "${SITE_DOMAIN}" > site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: ./site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
